[project]
name = "llms-xx-to-en-translation"
version = "0.1.0"
description = "Reproducible benchmark ranking open models on X->English translation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sacrebleu>=2.4",
]

[project.optional-dependencies]
gpu = [
    "datasets>=3.0",
    "huggingface-hub>=0.34",
    "transformers>=4.56",
    "vllm>=0.10",
]

[project.scripts]
xx2en = "xx_to_en.cli:main"

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "mutmut>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "radon>=6.0",
    "ruff>=0.6",
    "ty",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xx_to_en"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["xx_to_en"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mutmut]
paths_to_mutate = ["src/xx_to_en"]
tests_dir = ["tests"]
